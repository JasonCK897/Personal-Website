<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B2A4A" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="traceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8FB8E0" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#1B3B6F" stop-opacity="0.2" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="150" cy="150" r="145" fill="url(#bgGrad)" />
  
  <!-- Circuit Traces & Nodes -->
  <g stroke="url(#traceGrad)" stroke-width="2" fill="none">
    <path d="M 40 150 H 90 L 120 180 V 230" />
    <path d="M 260 150 H 210 L 180 120 V 70" />
    <path d="M 150 40 V 80 L 180 110" />
    <path d="M 150 260 V 220 L 120 190" />
    <circle cx="40" cy="150" r="4" fill="#8FB8E0" />
    <circle cx="260" cy="150" r="4" fill="#8FB8E0" />
    <circle cx="120" cy="230" r="4" fill="#8FB8E0" />
    <circle cx="180" cy="70" r="4" fill="#8FB8E0" />
  </g>

  <!-- Stylized Developer Silhouette -->
  <g fill="#F7F4EE">
    <!-- Head -->
    <circle cx="150" cy="115" r="42" fill="#F7F4EE" />
    <!-- Hair / Tech accent -->
    <path d="M 112 110 C 115 80 140 70 160 70 C 185 70 190 90 188 105 C 175 95 155 95 135 105 Z" fill="#1B3B6F" />
    <!-- Glasses / Modern Frame -->
    <rect x="126" y="105" width="20" height="12" rx="3" fill="none" stroke="#1B2A4A" stroke-width="2.5" />
    <rect x="154" y="105" width="20" height="12" rx="3" fill="none" stroke="#1B2A4A" stroke-width="2.5" />
    <line x1="146" y1="110" x2="154" y2="110" stroke="#1B2A4A" stroke-width="2" />
    <!-- Body / Shoulders -->
    <path d="M 85 240 C 85 185 115 170 150 170 C 185 170 215 185 215 240 Z" fill="#E2E8F0" />
    <path d="M 130 170 L 150 200 L 170 170 Z" fill="#1B3B6F" />
  </g>

  <!-- Floating Microcontroller Node Badge -->
  <rect x="110" y="240" width="80" height="24" rx="12" fill="#1B3B6F" stroke="#8FB8E0" stroke-width="1.5" />
  <text x="150" y="256" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="11" fill="#F7F4EE" text-anchor="middle" letter-spacing="1.5">FIRMWARE</text>
</svg>
