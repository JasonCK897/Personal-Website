<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0A0F1D" />
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <radialGradient id="meshCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <circle cx="200" cy="200" r="195" fill="url(#avatarGrad)" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="2" />
  
  <!-- Subtle Radial Aura -->
  <circle cx="200" cy="200" r="140" fill="url(#meshCenter)" />

  <!-- Geometric Circuit Traces & Golden Nodes -->
  <g stroke="#38BDF8" stroke-opacity="0.4" stroke-width="1.5" fill="none">
    <circle cx="200" cy="200" r="160" stroke-dasharray="8 6" />
    <circle cx="200" cy="200" r="120" stroke-opacity="0.2" />
    <line x1="40" y1="200" x2="110" y2="200" />
    <line x1="290" y1="200" x2="360" y2="200" />
    <line x1="200" y1="40" x2="200" y2="110" />
    <line x1="200" y1="290" x2="200" y2="360" />
    <line x1="85" y1="85" x2="135" y2="135" />
    <line x1="315" y1="315" x2="265" y2="265" />
    <circle cx="110" cy="200" r="3.5" fill="#38BDF8" />
    <circle cx="290" cy="200" r="3.5" fill="#38BDF8" />
    <circle cx="200" cy="110" r="3.5" fill="#38BDF8" />
    <circle cx="200" cy="290" r="3.5" fill="#38BDF8" />
  </g>

  <!-- Modern Technical Monogram "JCK" -->
  <g text-anchor="middle">
    <!-- Outer Shield / Hex Core -->
    <polygon points="200,105 275,148 275,252 200,295 125,252 125,148" fill="#1E293B" stroke="url(#neonGlow)" stroke-width="2.5" />
    
    <!-- Initials Typography -->
    <text x="200" y="215" font-family="'Space Grotesk', -apple-system, sans-serif" font-weight="700" font-size="52" fill="#F8FAFC" letter-spacing="3">JCK</text>
    <text x="200" y="244" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="11" fill="#38BDF8" letter-spacing="4">ENGINEERING</text>
  </g>
</svg>
