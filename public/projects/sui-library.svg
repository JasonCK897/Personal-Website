<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSui" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1E38" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <linearGradient id="suiCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="340" fill="url(#bgSui)" />

  <!-- Blockchain Node Network Mesh -->
  <g stroke="#38BDF8" stroke-opacity="0.2" stroke-width="1.2">
    <line x1="80" y1="80" x2="220" y2="140" />
    <line x1="220" y1="140" x2="300" y2="90" />
    <line x1="300" y1="90" x2="420" y2="130" />
    <line x1="420" y1="130" x2="520" y2="80" />
    <line x1="220" y1="140" x2="260" y2="240" />
    <line x1="300" y1="90" x2="380" y2="230" />
    <line x1="420" y1="130" x2="380" y2="230" />
  </g>

  <!-- Center: Stylized Sui Water Droplet Icon Motif -->
  <g transform="translate(300, 150)">
    <!-- Outer Glow Circle -->
    <circle cx="0" cy="0" r="50" fill="#38BDF8" fill-opacity="0.1" stroke="#38BDF8" stroke-width="1" stroke-dasharray="4 4" />
    <!-- Droplet Shape -->
    <path d="M 0 -35 C 18 -10, 28 8, 28 22 C 28 38, 15 50, 0 50 C -15 50, -28 38, -28 22 C -28 8, -18 -10, 0 -35 Z" fill="url(#suiCyan)" filter="drop-shadow(0 0 10px rgba(56, 189, 248, 0.5))" />
    <!-- Book silhouette inside droplet -->
    <path d="M -12 15 C -6 12, 0 14, 0 14 C 0 14, 6 12, 12 15 V 30 C 6 27, 0 29, 0 29 C 0 29, -6 27, -12 30 Z" fill="#FFFFFF" fill-opacity="0.9" />
  </g>

  <!-- Smart Contract Move Code Box -->
  <g transform="translate(50, 60)">
    <rect width="180" height="110" rx="8" fill="#0B132B" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.4" />
    <rect width="180" height="24" rx="8" fill="#1C2D5A" />
    <text x="12" y="16" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="10" fill="#38BDF8">library::book.move</text>
    <text x="12" y="44" font-family="'Courier New', monospace" font-size="9" fill="#93C5FD">public fun borrow_book(</text>
    <text x="20" y="60" font-family="'Courier New', monospace" font-size="9" fill="#93C5FD">  book: &amp;mut Book,</text>
    <text x="20" y="76" font-family="'Courier New', monospace" font-size="9" fill="#93C5FD">  ctx: &amp;mut TxContext</text>
    <text x="12" y="92" font-family="'Courier New', monospace" font-size="9" fill="#93C5FD">) { ... }</text>
  </g>

  <!-- React dApp Interface Card -->
  <g transform="translate(370, 70)">
    <rect width="180" height="95" rx="8" fill="#0B132B" stroke="#8FB8E0" stroke-width="1" stroke-opacity="0.4" />
    <rect width="180" height="24" rx="8" fill="#1C2D5A" />
    <text x="12" y="16" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="10" fill="#8FB8E0">Sui Wallet Connected</text>
    <rect x="15" y="38" width="150" height="16" rx="4" fill="#1E293B" />
    <text x="22" y="50" font-family="'Courier New', monospace" font-size="8" fill="#34D399">0x74a2...9d1e [Active]</text>
    <rect x="15" y="62" width="90" height="20" rx="4" fill="#2563EB" />
    <text x="60" y="75" font-family="'Space Grotesk', sans-serif" font-size="9" font-weight="600" fill="#FFFFFF" text-anchor="middle">Mint Book NFT</text>
  </g>

  <!-- Bottom Title Banner -->
  <g transform="translate(50, 245)">
    <rect width="500" height="55" rx="10" fill="#0B132B" stroke="#38BDF8" stroke-width="1" />
    <text x="250" y="26" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="13" fill="#F7F4EE" text-anchor="middle">SUI BLOCKCHAIN DECENTRALIZED LIBRARY DAPP</text>
    <text x="250" y="44" font-family="'Inter', sans-serif" font-size="10" fill="#93C5FD" text-anchor="middle">Sui Move Smart Contract + React Web3 Wallet Integration</text>
  </g>
</svg>
