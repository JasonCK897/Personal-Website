<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgShasta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1B2A4A" />
    </linearGradient>
    <linearGradient id="waveLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8FB8E0" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="340" fill="url(#bgShasta)" />

  <!-- Oscilloscope Grid Lines -->
  <g stroke="#8FB8E0" stroke-opacity="0.12" stroke-width="1">
    <line x1="0" y1="42.5" x2="600" y2="42.5" />
    <line x1="0" y1="85" x2="600" y2="85" />
    <line x1="0" y1="127.5" x2="600" y2="127.5" />
    <line x1="0" y1="170" x2="600" y2="170" stroke-width="1.5" stroke-opacity="0.3" />
    <line x1="0" y1="212.5" x2="600" y2="212.5" />
    <line x1="0" y1="255" x2="600" y2="255" />
    <line x1="0" y1="297.5" x2="600" y2="297.5" />
    <line x1="75" y1="0" x2="75" y2="340" />
    <line x1="150" y1="0" x2="150" y2="340" />
    <line x1="225" y1="0" x2="225" y2="340" />
    <line x1="300" y1="0" x2="300" y2="340" stroke-width="1.5" stroke-opacity="0.3" />
    <line x1="375" y1="0" x2="375" y2="340" />
    <line x1="450" y1="0" x2="450" y2="340" />
    <line x1="525" y1="0" x2="525" y2="340" />
  </g>

  <!-- Noisy Waveform Trail (Simulated Noise) -->
  <path d="M 0 170 Q 35 120 70 170 T 140 170 Q 155 90 175 170 T 210 170 Q 230 230 250 170 T 290 170 Q 320 60 350 170 T 420 170 Q 450 250 480 170 T 550 170 L 600 170" 
        fill="none" stroke="#EF4444" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="4 2" />

  <!-- Clean Filtered Waveform (Precision Synthesizer) -->
  <path d="M 0 170 C 50 70, 100 70, 150 170 C 200 270, 250 270, 300 170 C 350 70, 400 70, 450 170 C 500 270, 550 270, 600 170" 
        fill="none" stroke="url(#waveLine)" stroke-width="3" filter="drop-shadow(0 0 6px rgba(143, 184, 224, 0.8))" />

  <!-- Top Status Bar HUD -->
  <rect x="25" y="20" width="550" height="36" rx="8" fill="#1B2A4A" fill-opacity="0.8" stroke="#8FB8E0" stroke-width="1" stroke-opacity="0.4" />
  <circle cx="45" cy="38" r="4" fill="#10B981" />
  <text x="60" y="42" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="12" fill="#F7F4EE">PROJECT SHASTA : NOISE IMMUNITY SUITE</text>
  <text x="490" y="42" font-family="'Inter', sans-serif" font-size="10" fill="#8FB8E0" text-anchor="middle">STM32 + ESP32 RELAY</text>

  <!-- Hardware Dual-Node Badges -->
  <g transform="translate(60, 240)">
    <rect width="210" height="60" rx="8" fill="#0F172A" stroke="#8FB8E0" stroke-width="1" />
    <text x="15" y="24" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="12" fill="#8FB8E0">STM32 SYNTHESIZER</text>
    <text x="15" y="44" font-family="'Inter', sans-serif" font-size="10" fill="#B9C4D9">DAC 12-Bit Arbitrary Waveform</text>
  </g>

  <g transform="translate(330, 240)">
    <rect width="210" height="60" rx="8" fill="#0F172A" stroke="#8FB8E0" stroke-width="1" />
    <text x="15" y="24" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="12" fill="#8FB8E0">ESP32 WIRELESS RELAY</text>
    <text x="15" y="44" font-family="'Inter', sans-serif" font-size="10" fill="#B9C4D9">Realtime Telemetry &amp; Noise Metric</text>
  </g>
</svg>
