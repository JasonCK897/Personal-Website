<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgWater" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B2A4A" />
      <stop offset="100%" stop-color="#1B3B6F" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8FB8E0" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#8FB8E0" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <rect width="600" height="340" fill="url(#bgWater)" />

  <!-- Grid overlay -->
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="85" x2="600" y2="85" />
    <line x1="0" y1="170" x2="600" y2="170" />
    <line x1="0" y1="255" x2="600" y2="255" />
    <line x1="150" y1="0" x2="150" y2="340" />
    <line x1="300" y1="0" x2="300" y2="340" />
    <line x1="450" y1="0" x2="450" y2="340" />
  </g>

  <!-- Waves -->
  <path d="M 0 220 Q 150 190 300 220 T 600 220 V 340 H 0 Z" fill="url(#waveGrad)" />
  <path d="M 0 250 Q 150 230 300 250 T 600 250 V 340 H 0 Z" fill="#8FB8E0" fill-opacity="0.1" />

  <!-- ESP32 Chip Graphic -->
  <rect x="220" y="80" width="160" height="110" rx="10" fill="#0F172A" stroke="#8FB8E0" stroke-width="2" />
  <!-- Chip Pins -->
  <g fill="#8FB8E0">
    <rect x="235" y="70" width="8" height="10" />
    <rect x="255" y="70" width="8" height="10" />
    <rect x="275" y="70" width="8" height="10" />
    <rect x="295" y="70" width="8" height="10" />
    <rect x="315" y="70" width="8" height="10" />
    <rect x="335" y="70" width="8" height="10" />
    <rect x="355" y="70" width="8" height="10" />

    <rect x="235" y="190" width="8" height="10" />
    <rect x="255" y="190" width="8" height="10" />
    <rect x="275" y="190" width="8" height="10" />
    <rect x="295" y="190" width="8" height="10" />
    <rect x="315" y="190" width="8" height="10" />
    <rect x="335" y="190" width="8" height="10" />
    <rect x="355" y="190" width="8" height="10" />
  </g>
  <text x="300" y="125" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="18" fill="#F7F4EE" text-anchor="middle">ESP32 IoT</text>
  <text x="300" y="148" font-family="'Inter', sans-serif" font-weight="500" font-size="11" fill="#8FB8E0" text-anchor="middle">4 SENSOR TELEMETRY</text>

  <!-- 4 Sensor Badges -->
  <g transform="translate(60, 240)">
    <rect width="105" height="50" rx="8" fill="#1B2A4A" stroke="#8FB8E0" stroke-width="1" />
    <text x="52" y="24" font-family="'Inter', sans-serif" font-size="10" fill="#8FB8E0" text-anchor="middle">SUHU AIR</text>
    <text x="52" y="42" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="13" fill="#F7F4EE" text-anchor="middle">28.4 °C</text>
  </g>
  <g transform="translate(180, 240)">
    <rect width="105" height="50" rx="8" fill="#1B2A4A" stroke="#8FB8E0" stroke-width="1" />
    <text x="52" y="24" font-family="'Inter', sans-serif" font-size="10" fill="#8FB8E0" text-anchor="middle">KADAR pH</text>
    <text x="52" y="42" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="13" fill="#F7F4EE" text-anchor="middle">6.8 pH (Baik)</text>
  </g>
  <g transform="translate(300, 240)">
    <rect width="105" height="50" rx="8" fill="#1B2A4A" stroke="#8FB8E0" stroke-width="1" />
    <text x="52" y="24" font-family="'Inter', sans-serif" font-size="10" fill="#8FB8E0" text-anchor="middle">KEJERNIHAN</text>
    <text x="52" y="42" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="13" fill="#F7F4EE" text-anchor="middle">98% Jernih</text>
  </g>
  <g transform="translate(420, 240)">
    <rect width="105" height="50" rx="8" fill="#1B2A4A" stroke="#8FB8E0" stroke-width="1" />
    <text x="52" y="24" font-family="'Inter', sans-serif" font-size="10" fill="#8FB8E0" text-anchor="middle">KEDALAMAN</text>
    <text x="52" y="42" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="13" fill="#F7F4EE" text-anchor="middle">45.0 cm</text>
  </g>
</svg>
